<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post · MSc CS Class Assistant</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.6rem 1rem 4rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.4rem 1.5rem; box-shadow: var(--shadow); }
  h1 { font-size: 1.6rem; margin-bottom: .25rem; }
  .meta { font-size: .85rem; margin-bottom: 1.2rem; }
  .back { display: inline-block; margin-bottom: 1rem; color: var(--accent); font-size: .9rem; }
  .rich > * { margin: 0 0 .8rem; }
  .rich > :last-child { margin-bottom: 0; }
  .rich ul, .rich ol { padding-left: 1.3rem; }
  .rich a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .rich code { background: var(--accent-soft); padding: .05rem .35rem; border-radius: 5px; font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to assistant</a>
  <article class="card">
    <h1 id="t">Loading…</h1>
    <div class="meta muted" id="m"></div>
    <div id="b"></div>
  </article>
  <p class="muted" style="text-align:center;font-size:.8rem;margin-top:1.2rem"><a href="https://github.com/yashkolambekar/mscchat" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">View project on GitHub ↗</a></p>
</div>
<script src="/render.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get("id");
  try {
    const res = await fetch("/api/docs/" + encodeURIComponent(id));
    if (!res.ok) throw new Error();
    const d = await res.json();
    document.title = d.title + " · MSc CS Class Assistant";
    t.textContent = d.title;
    m.textContent = "Posted " + d.created_at.slice(0, 10) + (d.expires_at ? " · valid until " + d.expires_at : "");
    b.replaceChildren(renderRich(d.body));
  } catch {
    t.textContent = "Post not found";
    b.textContent = "This post doesn't exist, was removed, or has expired.";
  }
})();
</script>
</body>
</html>
