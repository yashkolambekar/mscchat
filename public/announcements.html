<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Announcements · MSc CS Class Assistant</title>
<link rel="stylesheet" href="/styles.css">
<style>
  .wrap { max-width: 720px; margin: 0 auto; padding: 1.6rem 1rem 4rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.2rem 1.4rem; box-shadow: var(--shadow); margin-bottom: 1rem; }
  h1 { font-size: 1.6rem; margin-bottom: 1rem; }
  .card h2 { font-size: 1.15rem; margin-bottom: .2rem; }
  .meta { font-size: .8rem; margin-bottom: .8rem; }
  .back { display: inline-block; margin-bottom: 1rem; color: var(--accent); font-size: .9rem; }
  .rich > * { margin: 0 0 .8rem; }
  .rich > :last-child { margin-bottom: 0; }
  .rich ul, .rich ol { padding-left: 1.3rem; }
  .rich a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; word-break: break-all; }
  .rich code { background: var(--accent-soft); padding: .05rem .35rem; border-radius: 5px; font-size: .9em; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Back to assistant</a>
  <h1>Announcements</h1>
  <div id="list"><p class="muted">Loading…</p></div>
</div>
<script src="/render.js"></script>
<script>
(async () => {
  const list = document.getElementById("list");
  try {
    const res = await fetch("/api/announcements");
    if (!res.ok) throw new Error();
    const items = await res.json();
    list.replaceChildren();
    if (!items.length) { list.innerHTML = '<p class="muted">No announcements yet.</p>'; return; }
    for (const d of items) {
      const card = document.createElement("article");
      card.className = "card";
      const h = document.createElement("h2");
      const link = document.createElement("a");
      link.href = "/post.html?id=" + d.id;
      link.textContent = d.title;
      link.style.cssText = "color:inherit;text-decoration:none";
      h.append(link);
      const m = document.createElement("div");
      m.className = "meta muted";
      m.textContent = "Announced " + d.announced_at.slice(0, 10) + (d.expires_at ? " · valid until " + d.expires_at : "");
      const open = document.createElement("a");
      open.href = "/post.html?id=" + d.id;
      open.textContent = "Open post →";
      open.style.cssText = "display:inline-block;margin-top:.8rem;font-size:.88rem;color:var(--accent)";
      card.append(h, m, renderRich(d.body), open);
      list.append(card);
    }
  } catch {
    list.textContent = "Could not load announcements.";
  }
})();
</script>
</body>
</html>
